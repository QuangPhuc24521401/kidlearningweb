<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=social.html?tab=chat">
<title>Chuyển hướng…</title>
<script>
  (function(){
    var q = location.search || '';
    var uid = '';
    try { uid = new URLSearchParams(q).get('uid'); } catch(e) {}
    location.replace('social.html?tab=chat' + (uid ? '&uid=' + encodeURIComponent(uid) : ''));
  })();
</script>
</head>
<body><p><a href="social.html?tab=chat">Mở Tin nhắn</a></p></body>
</html>
