<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang Giáo Viên 👩‍🏫</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<!-- Firebase compat SDK để guard role có thể đọc Firestore khi cần -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Baloo 2',cursive;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;display:flex;justify-content:center}
.wrap{width:700px;max-width:100%;padding-bottom:40px}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo-box{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.topbar h1{color:white;font-size:24px;font-weight:800;line-height:1.2}
.topbar p{color:rgba(255,255,255,.7);font-family:'Nunito',sans-serif;font-size:13px}
.logout-top{border:none;background:rgba(255,255,255,.18);color:white;border-radius:12px;padding:10px 16px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.logout-top:hover{background:rgba(255,255,255,.3)}

/* ── TABS ── */
.tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,.12);padding:6px;border-radius:18px}
.tab{flex:1;padding:12px;border:none;border-radius:14px;cursor:pointer;font-family:'Baloo 2',cursive;font-size:15px;font-weight:700;color:rgba(255,255,255,.7);background:transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:white;background:rgba(255,255,255,.15)}
.tab.active{background:white;color:#5b21b6;box-shadow:0 4px 14px rgba(0,0,0,.15)}

/* ── PANEL ── */
.panel{display:none}
.panel.active{display:block}

/* ── CARD ── */
.card{background:white;border-radius:22px;padding:22px 24px;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.card-title{font-size:17px;font-weight:800;color:#3a2d6e;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title span{display:flex;align-items:center;gap:8px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.stat-box{border-radius:16px;padding:16px 14px;text-align:center}
.stat-box.blue{background:linear-gradient(145deg,#dbeafe,#bfdbfe)}
.stat-box.green{background:linear-gradient(145deg,#d1fae5,#a7f3d0)}
.stat-box.purple{background:linear-gradient(145deg,#ede9fe,#ddd6fe)}
.stat-box.orange{background:linear-gradient(145deg,#ffedd5,#fed7aa)}
.stat-num{font-size:32px;font-weight:800;color:#1e1b4b;line-height:1}
.stat-label{font-family:'Nunito',sans-serif;font-size:12px;color:#6b7280;font-weight:700;margin-top:4px}
.stat-icon{font-size:22px;margin-bottom:4px}

/* ── STUDENT LIST ── */
.student-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
.student-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f8f9ff;border-radius:14px;border:1.5px solid #e0e7ff;transition:border-color .15s}
.student-row:hover{border-color:#c4b5fd}
.student-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.student-info{flex:1}
.student-name{font-size:15px;font-weight:800;color:#3a2d6e}
.student-meta{font-family:'Nunito',sans-serif;font-size:12px;color:#9ca3af;margin-top:2px}
.student-stars{display:flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#f59e0b}
.progress-mini{height:6px;border-radius:6px;background:#e0e7ff;margin-top:6px;overflow:hidden}
.progress-mini-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#a78bfa,#7c3aed);transition:width .6s}

/* ── HISTORY ── */
.history-list{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto}
.history-item{border-radius:14px;overflow:hidden;border:1.5px solid #e0e7ff}
.h-header{background:#f0e8ff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.h-student{font-size:13px;font-weight:800;color:#5b21b6;display:flex;align-items:center;gap:6px}
.h-time{font-family:'Nunito',sans-serif;font-size:11px;color:#9ca3af}
.h-q{background:#f8f4ff;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:14px;color:#3a2d6e;font-weight:700}
.h-q::before{content:'👦 '}
.h-a{background:#fff;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:13px;color:#5b21b6;line-height:1.5;border-top:1px solid #f0e8ff}
.h-a::before{content:'👩‍🏫 Cô Mai: '}
.empty{font-family:'Nunito',sans-serif;font-size:14px;color:#ccc;text-align:center;padding:28px;background:#fafafa;border-radius:14px}

/* ── PROGRESS REPORT ── */
.report-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border:2px solid #e0e7ff;border-radius:20px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:#f8f9ff;color:#3a2d6e;transition:all .15s}
.filter-btn.active{border-color:#7c3aed;background:#ede9fe;color:#5b21b6}
.report-chart{background:#f8f9ff;border-radius:16px;padding:16px;margin-bottom:14px}
.chart-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#6b7280;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-family:'Nunito',sans-serif;font-size:13px;color:#3a2d6e;font-weight:700;width:100px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:20px;background:#e0e7ff;border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width .8s cubic-bezier(.34,1.2,.64,1);position:relative}
.bar-fill::after{content:attr(data-val);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:white}
.bar-fill.nb{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.bar-fill.td{background:linear-gradient(90deg,#fb923c,#f97316)}
.bar-fill.ai{background:linear-gradient(90deg,#c084fc,#a855f7)}

/* refresh btn */
.refresh-btn{border:none;background:#f0e8ff;color:#6c3d9b;border-radius:10px;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.refresh-btn:hover{background:#e0d0ff}
.badge-pill{background:#7c3aed;color:white;border-radius:20px;padding:3px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-box">👩‍🏫</div>
      <div>
        <h1>Trang Giáo Viên</h1>
        <p id="teacherInfo">Lớp: đang tải...</p>
      </div>
    </div>
    <button class="logout-top" onclick="handleLogout()">🚪 Đăng xuất</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">📊 Tổng quan</button>
    <button class="tab" id="tab1" onclick="switchTab(1)">📋 Tiến độ học</button>
    <button class="tab" id="tab2" onclick="switchTab(2)">💬 Lịch sử AI</button>
  </div>

  <!-- ══ PANEL 0: TỔNG QUAN ══ -->
  <div class="panel active" id="panel0">
    <!-- Stat grid -->
    <div class="card">
      <div class="card-title"><span>📊 Thống kê hôm nay</span></div>
      <div class="stat-grid">
        <div class="stat-box blue"><div class="stat-icon">👦</div><div class="stat-num" id="statStudents">0</div><div class="stat-label">Bé đã học</div></div>
        <div class="stat-box green"><div class="stat-icon">⭐</div><div class="stat-num" id="statStars">0</div><div class="stat-label">Tổng sao</div></div>
        <div class="stat-box purple"><div class="stat-icon">💬</div><div class="stat-num" id="statQuestions">0</div><div class="stat-label">Câu hỏi AI</div></div>
      </div>
    </div>

    <!-- Student list -->
    <div class="card">
      <div class="card-title">
        <span>👦 Danh sách bé <span class="badge-pill" id="studentCount">0</span></span>
        <button class="refresh-btn" onclick="loadAll()">🔄</button>
      </div>
      <div class="student-list" id="studentList">
        <div class="empty">Chưa có dữ liệu bé nào</div>
      </div>
    </div>

  </div>

  <!-- ══ PANEL 1: TIẾN ĐỘ HỌC ══ -->
  <div class="panel" id="panel1">
    <div class="card">
      <div class="card-title"><span>📋 Báo cáo tiến độ</span></div>
      <div class="report-filter">
        <button class="filter-btn active" onclick="setFilter('all',this)">Tất cả</button>
        <button class="filter-btn" onclick="setFilter('nhan_biet',this)">👀 Nhận biết</button>
        <button class="filter-btn" onclick="setFilter('tu_duy',this)">🧠 Tư duy</button>
        <button class="filter-btn" onclick="setFilter('mentor',this)">👩‍🏫 Hỏi Cô AI</button>
      </div>

      <!-- Chart by category -->
      <div class="report-chart">
        <div class="chart-title">Phân bố hoạt động (tổng tất cả bé)</div>
        <div class="bar-row"><div class="bar-label">👀 Nhận biết</div><div class="bar-track"><div class="bar-fill nb" id="barNB" style="width:0%" data-val="0"></div></div></div>
        <div class="bar-row"><div class="bar-label">🧠 Tư duy</div><div class="bar-track"><div class="bar-fill td" id="barTD" style="width:0%" data-val="0"></div></div></div>
        <div class="bar-row"><div class="bar-label">👩‍🏫 Hỏi Cô AI</div><div class="bar-track"><div class="bar-fill ai" id="barAI" style="width:0%" data-val="0"></div></div></div>
      </div>

      <!-- Per-student progress -->
      <div class="student-list" id="progressList"><div class="empty">Chưa có dữ liệu</div></div>
    </div>
  </div>

  <!-- ══ PANEL 2: LỊCH SỬ AI ══ -->
  <div class="panel" id="panel2">
    <div class="card">
      <div class="card-title">
        <span>💬 Lịch sử hỏi Cô AI</span>
        <button class="refresh-btn" onclick="loadHistory()">🔄 Cập nhật</button>
      </div>
      <div class="history-list" id="historyList"><div class="empty">Chưa có lịch sử</div></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
/* ════════════════════════════════════════
   DATA HELPERS — đọc từ localStorage
   (trong thực tế sẽ đọc từ Firestore)
════════════════════════════════════════ */
function getHistory(){ try{ return JSON.parse(localStorage.getItem('mentor_history')||'[]'); }catch(e){ return []; } }
function getProgress(){ try{ return JSON.parse(localStorage.getItem('lesson_progress')||'{}'); }catch(e){ return {}; } }

// Demo: seed dữ liệu mẫu nếu chưa có
function seedDemo(){
  if(localStorage.getItem('demo_seeded')) return;
  const students = [
    {name:'Bé An',    avatar:'🐻', stars:12, nb:8, td:4, sessions:3},
    {name:'Bé Bình',  avatar:'🐱', stars:8,  nb:5, td:3, sessions:2},
    {name:'Bé Chi',   avatar:'🐰', stars:15, nb:9, td:6, sessions:4},
    {name:'Bé Dung',  avatar:'🐼', stars:6,  nb:4, td:2, sessions:2},
    {name:'Bé Em',    avatar:'🦊', stars:10, nb:6, td:4, sessions:3},
  ];
  localStorage.setItem('demo_students', JSON.stringify(students));

  const history = [
    {time:new Date(Date.now()-300000).toISOString(), student:'Bé An', q:'Cô ơi, hình tròn là gì?', a:'Hình tròn giống như mặt trời đó con! Tròn xoe, không có góc nào cả 🔵'},
    {time:new Date(Date.now()-600000).toISOString(), student:'Bé Chi', q:'Con đếm đến 10 được không cô?', a:'Con giỏi lắm! Cùng đếm nào: 1,2,3...10 🔢'},
    {time:new Date(Date.now()-900000).toISOString(), student:'Bé Bình', q:'Màu đỏ và màu xanh khác nhau thế nào?', a:'Màu đỏ như quả táo, màu xanh như bầu trời nhé con! 🍎🌤️'},
  ];
  localStorage.setItem('mentor_history', JSON.stringify(history));
  localStorage.setItem('demo_seeded', '1');
}

function getStudents(){
  try{ return JSON.parse(localStorage.getItem('demo_students')||'[]'); }catch(e){ return []; }
}

/* ════════════════════════════════════════
   TABS
════════════════════════════════════════ */
function switchTab(idx){
  for(let i=0;i<3;i++){
    document.getElementById('tab'+i).classList.toggle('active', i===idx);
    document.getElementById('panel'+i).classList.toggle('active', i===idx);
  }
  if(idx===0) loadAll();
  if(idx===1) loadProgress();
  if(idx===2) loadHistory();
}

/* ════════════════════════════════════════
   PANEL 0 — TỔNG QUAN
════════════════════════════════════════ */
function loadAll(){
  const students = getStudents();
  const history  = getHistory();

  // Stats
  document.getElementById('statStudents').textContent  = students.length;
  document.getElementById('statStars').textContent     = students.reduce((s,x)=>s+x.stars,0);
  document.getElementById('statQuestions').textContent = history.length;
  document.getElementById('studentCount').textContent  = students.length;

  // Student list
  const sl = document.getElementById('studentList');
  if(!students.length){ sl.innerHTML='<div class="empty">Chưa có bé nào trong lớp</div>'; }
  else sl.innerHTML = students.map(s=>{
    const pct = Math.round((s.nb+s.td)/20*100);
    return `<div class="student-row">
      <div class="student-avatar" style="background:#f0e8ff">${s.avatar}</div>
      <div class="student-info">
        <div class="student-name">${s.name}</div>
        <div class="student-meta">${s.sessions} buổi học • ${s.nb} bài Nhận biết • ${s.td} bài Tư duy</div>
        <div class="progress-mini"><div class="progress-mini-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="student-stars">⭐ ${s.stars}</div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   PANEL 1 — TIẾN ĐỘ HỌC
════════════════════════════════════════ */
let currentFilter = 'all';
function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderProgress();
}

function loadProgress(){ renderProgress(); }

function renderProgress(){
  const students = getStudents();
  const history  = getHistory();

  // Chart bars
  const totalNB = students.reduce((s,x)=>s+x.nb,0);
  const totalTD = students.reduce((s,x)=>s+x.td,0);
  const totalAI = history.length;
  const maxVal  = Math.max(totalNB, totalTD, totalAI, 1);

  function setBar(id, val, max){
    const el = document.getElementById(id);
    const pct = Math.round(val/max*100);
    el.style.width = pct+'%';
    el.setAttribute('data-val', val);
  }
  setBar('barNB', totalNB, maxVal);
  setBar('barTD', totalTD, maxVal);
  setBar('barAI', totalAI, maxVal);

  // Per-student progress
  const pl = document.getElementById('progressList');
  if(!students.length){ pl.innerHTML='<div class="empty">Chưa có dữ liệu</div>'; return; }

  pl.innerHTML = students.map(s=>{
    let score, label, color;
    if(currentFilter==='nhan_biet' || currentFilter==='all'){
      score = s.nb; label = '👀 '+s.nb+' bài Nhận biết';
      color = '#3b82f6';
    }
    if(currentFilter==='tu_duy'){
      score = s.td; label = '🧠 '+s.td+' bài Tư duy';
      color = '#f97316';
    }
    if(currentFilter==='mentor'){
      const cnt = history.filter(h=>h.student===s.name).length;
      score = cnt; label = '💬 '+cnt+' câu hỏi AI';
      color = '#a855f7';
    }
    const total = currentFilter==='all' ? s.nb+s.td : score;
    const max   = currentFilter==='all' ? 20 : 10;
    const pct   = Math.min(Math.round(total/max*100), 100);

    return `<div class="student-row">
      <div class="student-avatar" style="background:#f0e8ff">${s.avatar}</div>
      <div class="student-info">
        <div class="student-name">${s.name} <span style="font-weight:400;font-size:13px;color:#9ca3af">— ${label}</span></div>
        <div class="progress-mini" style="margin-top:8px">
          <div class="progress-mini-bar" style="width:${pct}%;background:${color}"></div>
        </div>
        <div style="font-family:'Nunito',sans-serif;font-size:11px;color:#9ca3af;margin-top:3px">${pct}% hoàn thành</div>
      </div>
      <div class="student-stars">⭐ ${s.stars}</div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   PANEL 2 — LỊCH SỬ AI
════════════════════════════════════════ */
function loadHistory(){
  const list = document.getElementById('historyList');
  const h = getHistory().reverse();
  if(!h.length){ list.innerHTML='<div class="empty">Bé chưa hỏi AI lần nào</div>'; return; }
  list.innerHTML = h.slice(0,30).map(item=>{
    const t = new Date(item.time).toLocaleString('vi-VN');
    const student = item.student || 'Bé học sinh';
    return `<div class="history-item">
      <div class="h-header">
        <div class="h-student">👦 ${student}</div>
        <div class="h-time">${t}</div>
      </div>
      <div class="h-q">${item.q}</div>
      <div class="h-a">${item.a}</div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   LOGOUT
════════════════════════════════════════ */
function handleLogout(){
  localStorage.removeItem('userRole');
  localStorage.removeItem('classRoom');
  localStorage.removeItem('userDisplayName');
  localStorage.removeItem('studentAvatarMode');
  localStorage.removeItem('studentAvatarEmoji');
  localStorage.removeItem('studentAvatarRing');
  localStorage.removeItem('studentAvatarPhoto');
  try{
    if(typeof firebase !== 'undefined' && firebase.auth){
      firebase.auth().signOut().finally(()=>{ window.location.href = 'auth/login.html'; });
      return;
    }
  }catch(e){}
  window.location.href = 'auth/login.html';
}

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
// Role guard: chỉ giáo viên mới được vào trang này.
// Nếu chưa có role trong localStorage, đợi Firebase auth load để check Firestore.
(function teacherGuard(){
  var role = localStorage.getItem('userRole');
  if(role === 'teacher'){
    return; // OK, đã xác nhận giáo viên
  }
  if(role && role !== 'teacher'){
    window.location.replace('index.html');
    return;
  }
  // Chưa có role → chuyển về login để xác thực lại.
  if(typeof firebase === 'undefined' || !firebase.auth){
    window.location.replace('auth/login.html');
    return;
  }
  firebase.auth().onAuthStateChanged(function(user){
    if(!user){ window.location.replace('auth/login.html'); return; }
    // Đọc role từ Firestore
    if(!firebase.firestore){
      window.location.replace('auth/login.html');
      return;
    }
    firebase.firestore().collection('users').doc(user.uid).get()
      .then(function(snap){
        var data = snap && snap.exists ? snap.data() : null;
        var r = data?.role || 'parent';
        if(r === 'teacher'){
          localStorage.setItem('userRole', 'teacher');
          if(data?.classRoom)   localStorage.setItem('classRoom', data.classRoom);
          if(data?.displayName) localStorage.setItem('userDisplayName', data.displayName);
          // Cập nhật UI sau khi load xong
          var info = document.getElementById('teacherInfo');
          if(info) info.textContent = 'Lớp: ' + (data?.classRoom || 'LOPA2024');
        } else {
          window.location.replace('index.html');
        }
      })
      .catch(function(err){
        console.warn('[teacherGuard] firestore read failed:', err);
        window.location.replace('auth/login.html');
      });
  });
})();

const classRoom = localStorage.getItem('classRoom') || 'LOPA2024';
document.getElementById('teacherInfo').textContent = 'Lớp: ' + classRoom;

seedDemo();
loadAll();
</script>
</body>
</html>
