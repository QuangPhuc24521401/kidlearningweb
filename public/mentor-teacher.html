<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang Giáo Viên 👩‍🏫</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<!-- Firebase compat SDK để guard role có thể đọc Firestore khi cần -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Baloo 2',cursive;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;display:flex;justify-content:center}
.wrap{width:700px;max-width:100%;padding-bottom:40px}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo-box{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.topbar h1{color:white;font-size:24px;font-weight:800;line-height:1.2}
.topbar p{color:rgba(255,255,255,.7);font-family:'Nunito',sans-serif;font-size:13px}
.logout-top{border:none;background:rgba(255,255,255,.18);color:white;border-radius:12px;padding:10px 16px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.logout-top:hover{background:rgba(255,255,255,.3)}

/* ── TABS ── */
.tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,.12);padding:6px;border-radius:18px}
.tab{flex:1;padding:12px;border:none;border-radius:14px;cursor:pointer;font-family:'Baloo 2',cursive;font-size:15px;font-weight:700;color:rgba(255,255,255,.7);background:transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:white;background:rgba(255,255,255,.15)}
.tab.active{background:white;color:#5b21b6;box-shadow:0 4px 14px rgba(0,0,0,.15)}

/* ── PANEL ── */
.panel{display:none}
.panel.active{display:block}

/* ── CARD ── */
.card{background:white;border-radius:22px;padding:22px 24px;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.card-title{font-size:17px;font-weight:800;color:#3a2d6e;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title span{display:flex;align-items:center;gap:8px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
.stat-box{border-radius:16px;padding:16px 14px;text-align:center}
.stat-box.blue{background:linear-gradient(145deg,#dbeafe,#bfdbfe)}
.stat-box.green{background:linear-gradient(145deg,#d1fae5,#a7f3d0)}
.stat-box.purple{background:linear-gradient(145deg,#ede9fe,#ddd6fe)}
.stat-box.orange{background:linear-gradient(145deg,#ffedd5,#fed7aa)}
.stat-num{font-size:32px;font-weight:800;color:#1e1b4b;line-height:1}
.stat-label{font-family:'Nunito',sans-serif;font-size:12px;color:#6b7280;font-weight:700;margin-top:4px}
.stat-icon{font-size:22px;margin-bottom:4px}

/* ── STUDENT LIST ── */
.student-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
.student-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f8f9ff;border-radius:14px;border:1.5px solid #e0e7ff;transition:border-color .15s}
.student-row:hover{border-color:#c4b5fd}
.student-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.student-info{flex:1}
.student-name{font-size:15px;font-weight:800;color:#3a2d6e}
.student-meta{font-family:'Nunito',sans-serif;font-size:12px;color:#9ca3af;margin-top:2px}
.student-stars{display:flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#f59e0b}
.progress-mini{height:6px;border-radius:6px;background:#e0e7ff;margin-top:6px;overflow:hidden}
.progress-mini-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#a78bfa,#7c3aed);transition:width .6s}

/* ── HISTORY ── */
.history-list{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto}
.history-item{border-radius:14px;overflow:hidden;border:1.5px solid #e0e7ff}
.h-header{background:#f0e8ff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.h-student{font-size:13px;font-weight:800;color:#5b21b6;display:flex;align-items:center;gap:6px}
.h-time{font-family:'Nunito',sans-serif;font-size:11px;color:#9ca3af}
.h-q{background:#f8f4ff;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:14px;color:#3a2d6e;font-weight:700}
.h-q::before{content:'👦 '}
.h-a{background:#fff;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:13px;color:#5b21b6;line-height:1.5;border-top:1px solid #f0e8ff}
.h-a::before{content:'👩‍🏫 Cô Mai: '}
.empty{font-family:'Nunito',sans-serif;font-size:14px;color:#ccc;text-align:center;padding:28px;background:#fafafa;border-radius:14px}

/* ── PROGRESS REPORT ── */
.report-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 16px;border:2px solid #e0e7ff;border-radius:20px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:#f8f9ff;color:#3a2d6e;transition:all .15s}
.filter-btn.active{border-color:#7c3aed;background:#ede9fe;color:#5b21b6}
.report-chart{background:#f8f9ff;border-radius:16px;padding:16px;margin-bottom:14px}
.chart-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#6b7280;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-family:'Nunito',sans-serif;font-size:13px;color:#3a2d6e;font-weight:700;width:100px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:20px;background:#e0e7ff;border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width .8s cubic-bezier(.34,1.2,.64,1);position:relative}
.bar-fill::after{content:attr(data-val);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:white}
.bar-fill.nb{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.bar-fill.td{background:linear-gradient(90deg,#fb923c,#f97316)}
.bar-fill.ai{background:linear-gradient(90deg,#c084fc,#a855f7)}

/* refresh btn */
.refresh-btn{border:none;background:#f0e8ff;color:#6c3d9b;border-radius:10px;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.refresh-btn:hover{background:#e0d0ff}
.badge-pill{background:#7c3aed;color:white;border-radius:20px;padding:3px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-box">👩‍🏫</div>
      <div>
        <h1>Trang Giáo Viên</h1>
        <p id="teacherInfo">Lớp: đang tải...</p>
      </div>
    </div>
    <button class="logout-top" onclick="handleLogout()">🚪 Đăng xuất</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">📊 Tổng quan</button>
    <button class="tab" id="tab1" onclick="switchTab(1)">📋 Tiến độ học</button>
    <button class="tab" id="tab2" onclick="switchTab(2)">💬 Lịch sử AI</button>
  </div>

  <!-- ══ PANEL 0: TỔNG QUAN ══ -->
  <div class="panel active" id="panel0">
    <!-- Stat grid -->
    <div class="card">
      <div class="card-title"><span>📊 Thống kê hôm nay</span></div>
      <div class="stat-grid">
        <div class="stat-box blue"><div class="stat-icon">👦</div><div class="stat-num" id="statStudents">0</div><div class="stat-label">Bé đã học</div></div>
        <div class="stat-box green"><div class="stat-icon">⭐</div><div class="stat-num" id="statStars">0</div><div class="stat-label">Tổng sao</div></div>
        <div class="stat-box purple"><div class="stat-icon">💬</div><div class="stat-num" id="statQuestions">0</div><div class="stat-label">Câu hỏi AI</div></div>
      </div>
    </div>

    <!-- Student list -->
    <div class="card">
      <div class="card-title">
        <span>👦 Danh sách bé <span class="badge-pill" id="studentCount">0</span></span>
        <button class="refresh-btn" onclick="refreshClassData()">🔄</button>
      </div>
      <div class="student-list" id="studentList">
        <div class="empty">Chưa có dữ liệu bé nào</div>
      </div>
    </div>

  </div>

  <!-- ══ PANEL 1: TIẾN ĐỘ HỌC ══ -->
  <div class="panel" id="panel1">
    <div class="card">
      <div class="card-title"><span>📋 Báo cáo tiến độ</span></div>
      <div class="report-filter">
        <button class="filter-btn active" onclick="setFilter('all',this)">Tất cả</button>
        <button class="filter-btn" onclick="setFilter('nhan_biet',this)">👀 Nhận biết</button>
        <button class="filter-btn" onclick="setFilter('tu_duy',this)">🧠 Tư duy</button>
        <button class="filter-btn" onclick="setFilter('mentor',this)">👩‍🏫 Hỏi Cô AI</button>
      </div>

      <!-- Chart by category -->
      <div class="report-chart">
        <div class="chart-title">Phân bố hoạt động (tổng tất cả bé)</div>
        <div class="bar-row"><div class="bar-label">👀 Nhận biết</div><div class="bar-track"><div class="bar-fill nb" id="barNB" style="width:0%" data-val="0"></div></div></div>
        <div class="bar-row"><div class="bar-label">🧠 Tư duy</div><div class="bar-track"><div class="bar-fill td" id="barTD" style="width:0%" data-val="0"></div></div></div>
        <div class="bar-row"><div class="bar-label">👩‍🏫 Hỏi Cô AI</div><div class="bar-track"><div class="bar-fill ai" id="barAI" style="width:0%" data-val="0"></div></div></div>
      </div>

      <!-- Per-student progress -->
      <div class="student-list" id="progressList"><div class="empty">Chưa có dữ liệu</div></div>
    </div>
  </div>

  <!-- ══ PANEL 2: LỊCH SỬ AI ══ -->
  <div class="panel" id="panel2">
    <div class="card">
      <div class="card-title">
        <span>💬 Lịch sử hỏi Cô AI</span>
        <button class="refresh-btn" onclick="refreshClassData()">🔄 Cập nhật</button>
      </div>
      <div class="history-list" id="historyList"><div class="empty">Chưa có lịch sử</div></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
/* ════════════════════════════════════════
   TRANG GIÁO VIÊN — dữ liệu từ Firestore
   Học sinh: users (role=parent, classRoom)
   Tiến độ + lịch sử AI: learning_progress/{uid}
════════════════════════════════════════ */

var classData = { students: [], history: [], classRoom: '', loading: false, error: '' };

function escapeHtml(str){
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function studentDisplayName(u){
  return (u && (u.displayName || u.nickname || u.childName)) || 'Bé học sinh';
}

function aggregateSubject(entry){
  if(!entry || !entry.topics || typeof entry.topics !== 'object'){
    return { topicsDone: 0, topicsTotal: 0, stars: 0, lastSessionAt: 0 };
  }
  var topics = Object.values(entry.topics);
  var topicsTotal = topics.length;
  var topicsDone = topics.filter(function(t){ return (t.completedRuns || 0) >= 1; }).length;
  var stars = topics.reduce(function(s, t){ return s + (t.totalStars || 0); }, 0);
  var lastSessionAt = topics.reduce(function(m, t){ return Math.max(m, t.lastSessionAt || 0); }, 0);
  return { topicsDone: topicsDone, topicsTotal: topicsTotal, stars: stars, lastSessionAt: lastSessionAt };
}

function computeStudentStats(progress){
  progress = progress || {};
  var nb = aggregateSubject(progress.nhan_biet);
  var td = aggregateSubject(progress.tu_duy);
  var subjects = ['nhan_biet','tu_duy','am_nhac','ghep_hinh','my_thuat','ngon_ngu'];
  var totalStars = 0;
  var sessions = 0;
  var lastActive = 0;
  subjects.forEach(function(sub){
    var agg = aggregateSubject(progress[sub]);
    totalStars += agg.stars;
    if(agg.topicsDone > 0 || agg.lastSessionAt > 0) sessions += 1;
    lastActive = Math.max(lastActive, agg.lastSessionAt);
  });
  return {
    nb: nb.topicsDone,
    nbTotal: nb.topicsTotal,
    td: td.topicsDone,
    tdTotal: td.topicsTotal,
    stars: totalStars,
    sessions: sessions,
    lastActive: lastActive,
    hasActivity: nb.topicsDone + td.topicsDone + totalStars > 0
  };
}

function isToday(iso){
  if(!iso) return false;
  var d = new Date(iso);
  var now = new Date();
  return d.getFullYear() === now.getFullYear()
    && d.getMonth() === now.getMonth()
    && d.getDate() === now.getDate();
}

function isTodayMs(ms){
  if(!ms) return false;
  return isToday(new Date(ms).toISOString());
}

function setTeacherInfo(text){
  var info = document.getElementById('teacherInfo');
  if(info) info.textContent = text;
}

function refreshClassData(){
  if(classData.loading) return Promise.resolve();
  classData.loading = true;
  classData.error = '';

  var sl = document.getElementById('studentList');
  if(sl) sl.innerHTML = '<div class="empty">Đang tải danh sách bé…</div>';

  return new Promise(function(resolve){
    try{
      if(typeof firebase === 'undefined' || !firebase.firestore || !firebase.auth){
        classData.error = 'Firebase chưa sẵn sàng';
        classData.loading = false;
        resolve();
        return;
      }
      var user = firebase.auth().currentUser;
      if(!user){
        classData.error = 'Cần đăng nhập';
        classData.loading = false;
        resolve();
        return;
      }

      var classRoom = localStorage.getItem('classRoom') || '';
      if(!classRoom){
        firebase.firestore().collection('users').doc(user.uid).get()
          .then(function(snap){
            var data = snap && snap.exists ? snap.data() : null;
            if(data && data.classRoom){
              classRoom = data.classRoom;
              localStorage.setItem('classRoom', classRoom);
            }
          })
          .finally(function(){ doFetch(classRoom, resolve); });
        return;
      }
      doFetch(classRoom, resolve);
    }catch(e){
      classData.error = e.message || 'Lỗi tải dữ liệu';
      classData.loading = false;
      resolve();
    }
  });

  function doFetch(classRoom, resolve){
    classData.classRoom = classRoom || '';
    setTeacherInfo('Lớp: ' + (classRoom || '—'));

    if(!classRoom){
      classData.students = [];
      classData.history = [];
      classData.error = 'Chưa có mã lớp trên tài khoản giáo viên';
      classData.loading = false;
      loadAll();
      resolve();
      return;
    }

    firebase.firestore().collection('users')
      .where('role', '==', 'parent')
      .where('classRoom', '==', classRoom)
      .get()
      .then(function(usersSnap){
        if(!usersSnap.size){
          classData.students = [];
          classData.history = [];
          classData.loading = false;
          loadAll();
          if(document.getElementById('panel1').classList.contains('active')) renderProgress();
          if(document.getElementById('panel2').classList.contains('active')) loadHistory();
          resolve();
          return;
        }

        var jobs = [];
        usersSnap.forEach(function(doc){
          jobs.push(
            firebase.firestore().collection('learning_progress').doc(doc.id).get()
              .then(function(progSnap){
                var u = doc.data() || {};
                var progDoc = progSnap && progSnap.exists ? (progSnap.data() || {}) : {};
                var progress = progDoc.progress || {};
                var mentorHistory = Array.isArray(progDoc.mentorHistory) ? progDoc.mentorHistory : [];
                var name = studentDisplayName(u);
                var stats = computeStudentStats(progress);
                var avatar = (u.studentAvatarEmoji && String(u.studentAvatarEmoji).trim()) || '🧒';
                var ring = (u.studentAvatarRing && /^#[0-9A-Fa-f]{6}$/.test(u.studentAvatarRing))
                  ? u.studentAvatarRing : '#f0e8ff';
                var historyItems = mentorHistory.map(function(h){
                  return {
                    time: h.time || '',
                    q: h.q || '',
                    a: h.a || '',
                    student: h.student || name,
                    uid: doc.id,
                    classRoom: h.classRoom || classRoom
                  };
                });
                return {
                  uid: doc.id,
                  name: name,
                  avatar: avatar,
                  ring: ring,
                  profileComplete: u.studentProfileComplete !== false,
                  mentorCount: mentorHistory.length,
                  historyItems: historyItems,
                  stats: stats
                };
              })
          );
        });

        return Promise.all(jobs).then(function(rows){
          classData.students = rows.map(function(row){
            return {
              uid: row.uid,
              name: row.name,
              avatar: row.avatar,
              ring: row.ring,
              profileComplete: row.profileComplete,
              mentorCount: row.mentorCount,
              nb: row.stats.nb,
              nbTotal: row.stats.nbTotal,
              td: row.stats.td,
              tdTotal: row.stats.tdTotal,
              stars: row.stats.stars,
              sessions: row.stats.sessions,
              hasActivity: row.stats.hasActivity,
              lastActive: row.stats.lastActive
            };
          }).sort(function(a, b){ return a.name.localeCompare(b.name, 'vi'); });

          classData.history = [];
          rows.forEach(function(row){
            (row.historyItems || []).forEach(function(h){ classData.history.push(h); });
          });
          classData.history.sort(function(a, b){
            return new Date(b.time || 0) - new Date(a.time || 0);
          });

          classData.loading = false;
          loadAll();
          if(document.getElementById('panel1').classList.contains('active')) renderProgress();
          if(document.getElementById('panel2').classList.contains('active')) loadHistory();
          resolve();
        });
      })
      .catch(function(err){
        console.warn('[mentor-teacher] fetch', err);
        classData.error = err.message || 'Không tải được dữ liệu lớp';
        classData.loading = false;
        loadAll();
        resolve();
      });
  }
}

function switchTab(idx){
  for(var i = 0; i < 3; i++){
    document.getElementById('tab'+i).classList.toggle('active', i === idx);
    document.getElementById('panel'+i).classList.toggle('active', i === idx);
  }
  if(idx === 0) loadAll();
  if(idx === 1) loadProgress();
  if(idx === 2) loadHistory();
}

function loadAll(){
  var students = classData.students || [];
  var history  = classData.history || [];
  var activeToday = students.filter(function(s){
    return isTodayMs(s.lastActive) || history.some(function(h){
      return h.uid === s.uid && isToday(h.time);
    });
  }).length;
  var questionsToday = history.filter(function(h){ return isToday(h.time); }).length;
  var starsToday = students.filter(function(s){ return isTodayMs(s.lastActive); })
    .reduce(function(sum, s){ return sum + (s.stars || 0); }, 0);

  document.getElementById('statStudents').textContent  = activeToday || students.filter(function(s){ return s.hasActivity; }).length;
  document.getElementById('statStars').textContent     = starsToday || students.reduce(function(sum, s){ return sum + (s.stars || 0); }, 0);
  document.getElementById('statQuestions').textContent = questionsToday || history.length;
  document.getElementById('studentCount').textContent  = students.length;

  var sl = document.getElementById('studentList');
  if(classData.loading){
    sl.innerHTML = '<div class="empty">Đang tải danh sách bé…</div>';
    return;
  }
  if(classData.error){
    sl.innerHTML = '<div class="empty">' + escapeHtml(classData.error) + '</div>';
    return;
  }
  if(!students.length){
    sl.innerHTML = '<div class="empty">Chưa có học sinh đăng ký lớp <strong>' + escapeHtml(classData.classRoom) + '</strong>.<br>Phụ huynh cần nhập đúng mã lớp khi đăng ký.</div>';
    return;
  }

  sl.innerHTML = students.map(function(s){
    var maxTopics = Math.max((s.nbTotal || 0) + (s.tdTotal || 0), 1);
    var pct = Math.min(Math.round(((s.nb || 0) + (s.td || 0)) / maxTopics * 100), 100);
    var status = s.hasActivity ? '' : ' • chưa học';
    var setup = s.profileComplete ? '' : ' • chưa tạo avatar';
    return '<div class="student-row">' +
      '<div class="student-avatar" style="background:' + escapeHtml(s.ring) + '">' + escapeHtml(s.avatar) + '</div>' +
      '<div class="student-info">' +
        '<div class="student-name">' + escapeHtml(s.name) + '</div>' +
        '<div class="student-meta">' + (s.sessions || 0) + ' môn có tiến độ • ' + (s.nb || 0) + ' bài Nhận biết • ' + (s.td || 0) + ' bài Tư duy' + status + setup + '</div>' +
        '<div class="progress-mini"><div class="progress-mini-bar" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="student-stars">⭐ ' + (s.stars || 0) + '</div>' +
    '</div>';
  }).join('');
}

var currentFilter = 'all';
function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  renderProgress();
}

function loadProgress(){ renderProgress(); }

function renderProgress(){
  var students = classData.students || [];
  var history  = classData.history || [];

  var totalNB = students.reduce(function(s, x){ return s + (x.nb || 0); }, 0);
  var totalTD = students.reduce(function(s, x){ return s + (x.td || 0); }, 0);
  var totalAI = history.length;
  var maxVal  = Math.max(totalNB, totalTD, totalAI, 1);

  function setBar(id, val, max){
    var el = document.getElementById(id);
    if(!el) return;
    var pct = Math.round(val / max * 100);
    el.style.width = pct + '%';
    el.setAttribute('data-val', val);
  }
  setBar('barNB', totalNB, maxVal);
  setBar('barTD', totalTD, maxVal);
  setBar('barAI', totalAI, maxVal);

  var pl = document.getElementById('progressList');
  if(classData.loading){
    pl.innerHTML = '<div class="empty">Đang tải tiến độ…</div>';
    return;
  }
  if(!students.length){
    pl.innerHTML = '<div class="empty">Chưa có học sinh trong lớp</div>';
    return;
  }

  pl.innerHTML = students.map(function(s){
    var score, label, color, max;
    if(currentFilter === 'nhan_biet'){
      score = s.nb || 0;
      label = '👀 ' + score + ' bài Nhận biết';
      color = '#3b82f6';
      max = Math.max(s.nbTotal || 1, 1);
    } else if(currentFilter === 'tu_duy'){
      score = s.td || 0;
      label = '🧠 ' + score + ' bài Tư duy';
      color = '#f97316';
      max = Math.max(s.tdTotal || 1, 1);
    } else if(currentFilter === 'mentor'){
      score = s.mentorCount || 0;
      label = '💬 ' + score + ' câu hỏi AI';
      color = '#a855f7';
      max = Math.max(score, 10);
    } else {
      score = (s.nb || 0) + (s.td || 0);
      label = '👀 ' + (s.nb || 0) + ' + 🧠 ' + (s.td || 0) + ' bài';
      color = '#7c3aed';
      max = Math.max((s.nbTotal || 0) + (s.tdTotal || 0), 1);
    }
    var pct = Math.min(Math.round(score / max * 100), 100);

    return '<div class="student-row">' +
      '<div class="student-avatar" style="background:' + escapeHtml(s.ring) + '">' + escapeHtml(s.avatar) + '</div>' +
      '<div class="student-info">' +
        '<div class="student-name">' + escapeHtml(s.name) + ' <span style="font-weight:400;font-size:13px;color:#9ca3af">— ' + label + '</span></div>' +
        '<div class="progress-mini" style="margin-top:8px">' +
          '<div class="progress-mini-bar" style="width:' + pct + '%;background:' + color + '"></div>' +
        '</div>' +
        '<div style="font-family:\'Nunito\',sans-serif;font-size:11px;color:#9ca3af;margin-top:3px">' + pct + '% hoàn thành</div>' +
      '</div>' +
      '<div class="student-stars">⭐ ' + (s.stars || 0) + '</div>' +
    '</div>';
  }).join('');
}

function loadHistory(){
  var list = document.getElementById('historyList');
  var h = (classData.history || []).slice();
  if(classData.loading){
    list.innerHTML = '<div class="empty">Đang tải lịch sử…</div>';
    return;
  }
  if(!h.length){
    list.innerHTML = '<div class="empty">Bé trong lớp chưa hỏi Cô AI lần nào</div>';
    return;
  }
  list.innerHTML = h.slice(0, 30).map(function(item){
    var t = item.time ? new Date(item.time).toLocaleString('vi-VN') : '';
    var student = item.student || 'Bé học sinh';
    return '<div class="history-item">' +
      '<div class="h-header">' +
        '<div class="h-student">👦 ' + escapeHtml(student) + '</div>' +
        '<div class="h-time">' + escapeHtml(t) + '</div>' +
      '</div>' +
      '<div class="h-q">' + escapeHtml(item.q) + '</div>' +
      '<div class="h-a">' + escapeHtml(item.a) + '</div>' +
    '</div>';
  }).join('');
}

function handleLogout(){
  localStorage.removeItem('userRole');
  localStorage.removeItem('classRoom');
  localStorage.removeItem('userDisplayName');
  localStorage.removeItem('studentAvatarMode');
  localStorage.removeItem('studentAvatarEmoji');
  localStorage.removeItem('studentAvatarRing');
  localStorage.removeItem('studentAvatarPhoto');
  try{
    if(typeof firebase !== 'undefined' && firebase.auth){
      firebase.auth().signOut().finally(function(){ window.location.href = 'auth/login.html'; });
      return;
    }
  }catch(e){}
  window.location.href = 'auth/login.html';
}

function startTeacherDashboard(){
  firebase.auth().onAuthStateChanged(function(user){
    if(!user){
      window.location.replace('auth/login.html');
      return;
    }
    refreshClassData();
  });
}

(function teacherGuard(){
  var role = localStorage.getItem('userRole');
  if(role && role !== 'teacher'){
    window.location.replace('index.html');
    return;
  }
  if(typeof firebase === 'undefined' || !firebase.auth){
    window.location.replace('auth/login.html');
    return;
  }

  if(role === 'teacher'){
    startTeacherDashboard();
    return;
  }

  firebase.auth().onAuthStateChanged(function(user){
    if(!user){ window.location.replace('auth/login.html'); return; }
    if(!firebase.firestore){
      window.location.replace('auth/login.html');
      return;
    }
    firebase.firestore().collection('users').doc(user.uid).get()
      .then(function(snap){
        var data = snap && snap.exists ? snap.data() : null;
        var r = data && data.role ? data.role : 'parent';
        if(r === 'teacher'){
          localStorage.setItem('userRole', 'teacher');
          if(data.classRoom) localStorage.setItem('classRoom', data.classRoom);
          if(data.displayName) localStorage.setItem('userDisplayName', data.displayName);
          setTeacherInfo('Lớp: ' + (data.classRoom || '—'));
          startTeacherDashboard();
        } else {
          window.location.replace('index.html');
        }
      })
      .catch(function(err){
        console.warn('[teacherGuard] firestore read failed:', err);
        window.location.replace('auth/login.html');
      });
  });
})();
</script>
