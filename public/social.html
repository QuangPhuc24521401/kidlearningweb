<script>
  (function deepRoleGuard(){
    if(localStorage.getItem('userRole')) return;
    if(typeof firebase === 'undefined' || !firebase.auth || !firebase.firestore) return;
    firebase.auth().onAuthStateChanged(function(user){
      if(!user){ window.location.replace('auth/login.html'); return; }
      firebase.firestore().collection('users').doc(user.uid).get()
        .then(function(snap){
          var data = snap && snap.exists ? snap.data() : null;
          var role = data?.role || 'parent';
          localStorage.setItem('userRole', role);
          if(data?.displayName) localStorage.setItem('userDisplayName', data.displayName);
          if(role === 'teacher') window.location.replace('mentor-teacher.html');
        });
    });
  })();
</script>
